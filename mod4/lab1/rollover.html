<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Rollover Images</title>
	<link href="./site.css" rel="stylesheet">
	<style>
		#gallery img {
			display: inline-block;
			margin: 10px;
			border: 1px solid rgb(0, 0, 0);
		}
	</style>
	<script src="jquery.min.js"></script>

	<script>
		$(document).ready(function () {
			$('#gallery img').each(function () {
				var imgFile = $(this).attr('src');
				var preloadImage = new Image();
				var imgExt = /(\.\w{3,4}$)/;
				preloadImage.src = imgFile.replace(imgExt, '_h$1');

				$(this).hover(
					function () {
						$(this).attr('src', preloadImage.src);
					},
					function () {
						$(this).attr('src', imgFile);
					}
				);
			});
		});
	</script>
</head>

<body>
	<div class="wrapper">
		<header>
			JAVASCRIPT <span class="amp">&amp;</span> jQUERY: THE&nbsp;MISSING&nbsp;MANUAL
		</header>
		<div class="content">
			<div class="main">
				<h1>Rollover Images</h1>
				<p>Mouse over the images below</p>
				<div id="gallery">
					<img src="example/10_b.jpg" alt="">
					<img src="example/10_s.jpg" alt="">
					<img src="example/11_b.jpg" alt="">
					<img src="example/9_s.jpg" alt="">
					<img src="example/9_b.jpg" alt="">
					<img src="example/10_b.jpg" alt="">
					<img src="example/1_b.jpg" alt="">
					<img src="example/5_s.jpg" alt="">
				</div>
			</div>
		</div>
		<footer>
			<p>JavaScript &amp; jQuery: The Missing Manual, 3rd Edition, by <a href="http://sawmac.com/">David
					McFarland</a>. Published by <a href="http://oreilly.com/">O'Reilly Media, Inc</a>.</p>
		</footer>
	</div>
</body>

</html>
